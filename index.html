<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <title>Terra</title>
  <link rel="icon" href="path/to/favicon.ico" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <link href="./assets/terra.css" rel="stylesheet" />
  <style>
    body {
      background: url('/assets/lunar-sunset.svg') no-repeat center center fixed;
      background-size: cover;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .layout-typography-grid > div {
      position: relative;
      display: flex;
      justify-content: center;      
      background: var(--yellow);
      padding: 3rem;
      font-size: 3rem;
    }

    .layout-typography-grid > div > p {
      position: absolute;
      right: .5rem;
      bottom: .5rem;
    }

    .palette {
      display: grid;
      grid-template-columns: 1fr;
      gap: .5rem;
    }

    @media(min-width: 600px) {
      .palette {
        grid-template-columns: 1fr 1fr 1fr;
      }
    }

    @media(min-width: 1200px) {
      .palette {
        grid-template-columns: 1fr;
      }
    }

    .fjord-bg {
      background-image: url("/assets/Fjord.png");
    }

    .layout-materials {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 1rem;
    }

    .layout-materials > * {
      height: 256px;
    }

    .loader-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 256px;
    }
    
  </style>
</head>

    </nav>
  </header>
