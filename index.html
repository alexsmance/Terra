<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <title>Terra</title>
  <link rel="icon" href="./favicon.png" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <link href="./assets/terra.css" rel="stylesheet" />
  <link href="./assets/docs.css" rel="stylesheet" />
  <style>
    body {
      background: url('/assets/lunar-sunset.svg') no-repeat center center fixed;
      background-size: cover;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    @media (prefers-color-scheme: dark) {
      nav.glass {
        color: #333333;
      }
      
      header > h1,
      header > nav > a,
      header > nav > a:visited {
        color: #333333;
      }

      button {
        color: #333333;
      }      
    }

    @media(min-width: 600px) {
      .palette {
        grid-template-columns: 1fr 1fr 1fr;
      }
    }

    @media(min-width: 1200px) {
      .palette {
        grid-template-columns: 1fr;
      }
    }

    .layout-materials {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 1rem;
    }

    .layout-materials > * {
      height: 256px;
    }

    .loader-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 256px;
    }
    
    .download-actions {
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>

<body>
  <header class="container">
    <h1 class="title margin-bottom">Terra</h1>

    <nav class="glass padding shadow-low">
      <a href="./index.html">Home</a>
      <a href="./buttons.html">Buttons</a>
      <a href="./content.html">Content</a>
      <a href="./data.html">Data</a>
      <a href="./forms.html">Forms</a>
      <a href="./palette.html">Palette</a>    
      <a href="./terminal.html">Terminal</a>
      <a href="./typography.html">Typography</a>
    </nav>
  </header>
  
  <main class="container" style="margin-top: 24rem;">
    <div class="glass padding shadow-low">      
      <p class="margin-bottom">Terra is a ui framework with a simple api and low ceremony to create web applications and easily customisable with a minimal api surface and focuses on accessibility.</p>      
      <div class="download-actions">        
        <button type="button" class="primary" style="margin-right: 1rem;">
          <span class="material-symbols-outlined">download</span>
          Download
        </button>
        <button type="button">
          <span class="material-symbols-outlined">content_copy</span>
          CDN
        </button>
      </div>
    </div>
  </main>
